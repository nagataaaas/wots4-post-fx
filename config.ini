; Post FX settings. The in-game "Post FX" options tab changes the same values and
; writes them here when the game saves its options. Exit the game before editing.

[antialiasing]
; Edge smoothing applied to the 3D image.
;   off  - no anti-aliasing
;   fxaa - fast; fine patterns can become softer
;   smaa - SMAA 1x (High preset); detects edge shapes
method=off
; Render the 3D scene at a higher resolution and average it down. Applied at the next game start.
;   off - native resolution
;   2x  - twice the width and height (4 samples per pixel); much higher GPU and memory load
supersampling=off

[motion_blur]
; Blur that follows camera movement. 1 = on, 0 = off.
enabled=0
; Exposure of the blur: low, normal or high.
strength=normal
; Samples per pixel: low (4), normal (8) or high (12). Higher quality costs more GPU time.
quality=normal
